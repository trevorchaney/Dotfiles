# Learn how to configure Hyprland: https://wiki.hyprland.org/Configuring/

# Use defaults Omarchy defaults (but don't edit these directly!)
source = ~/.local/share/omarchy/default/hypr/autostart.conf
source = ~/.local/share/omarchy/default/hypr/bindings/media.conf
source = ~/.local/share/omarchy/default/hypr/bindings/clipboard.conf
source = ~/.local/share/omarchy/default/hypr/bindings/tiling-v2.conf
source = ~/.local/share/omarchy/default/hypr/bindings/utilities.conf
source = ~/.local/share/omarchy/default/hypr/envs.conf
source = ~/.config/hypr/looknfeel-base.conf
source = ~/.local/share/omarchy/default/hypr/input.conf
source = ~/.local/share/omarchy/default/hypr/windows.conf
source = ~/.config/omarchy/current/theme/hyprland.conf

# Change your own setup in these files (and overwrite any settings from defaults!)
source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/input.conf
source = ~/.config/hypr/bindings.conf
source = ~/.config/hypr/looknfeel.conf
source = ~/.config/hypr/autostart.conf

# Hyprexpo overview plugin configuration
plugin:hyprexpo {
  columns = 3
  gap_size = 5
  bg_col = rgb(000000)
  skip_empty = true
}

# Add any other personal Hyprland configuration below
# windowrule = workspace 5, match:class qemu


# Steam/Proton game window rules
# Reason: Hyprland v0.54.x has a bug in CReservedArea/getWindowIdealBoundingBoxIgnoreReserved
# that can crash the compositor (ABRT signal) when tiled game windows interact with
# moveFocusTo keybinds. Floating these windows avoids triggering the layout bug.
# See crash report: ~/.cache/hyprland/hyprlandCrashReport1809.txt

# Float Steam popups, dialogs, and settings windows
windowrule = float 1, match:class ^(steam)$, match:title negative:^(Steam)$

# Float image viewer
windowrule = float 1, match:class ^(org.nomacs.ImageLounge)$

# Float Proton/Wine game windows to avoid tiling layout crashes
windowrule = float 1, match:class ^(steam_app_.*)$
windowrule = float 1, match:class ^(gamescope)$
windowrule = float 1, match:class ^(retroarch)$

# Suppress maximize/fullscreen events from games that request them unexpectedly
windowrule = suppress_event maximize, match:class ^(steam_app_.*)$

# Lid switch — disable laptop screen when closed if externals are connected
bindl = , switch:on:Lid Switch, exec, ~/.config/hypr/scripts/lid.sh close
bindl = , switch:off:Lid Switch, exec, ~/.config/hypr/scripts/lid.sh open

# Toggle config flags dynamically
source = ~/.local/state/omarchy/toggles/hypr/*.conf
