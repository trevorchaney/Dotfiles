# Extra autostart processes
# exec-once = uwsm-app -- my-service
# exec-once = uwsm-app -- gromit-mpx
exec-once = uwsm app -- hyprsunset
# Loads plugins (e.g. hyprexpo) then reloads config so dispatchers register correctly.
# Note: if plugins fail to load after a Hyprland update, run `hyprpm update` manually.
exec-once = hyprpm reload -n && hyprctl reload
exec-once = ~/.config/hypr/scripts/monitor-watch.sh
